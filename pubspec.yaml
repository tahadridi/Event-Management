name: event_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  table_calendar: ^3.1.2
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.4
  firebase_storage: 12.4.10
  shared_preferences: ^2.2.0
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  google_sign_in: ^6.2.1
  
  # Payments
  flutter_stripe: ^10.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # State management & navigation
  provider: ^6.1.2
  go_router: ^14.2.0

  # Localization & formatting
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Location
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  http: ^1.6.0

  # Icons
  cupertino_icons: ^1.0.8
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env